[package]
name = "woodshed"
description = "Build-script toolkit for vendoring, caching, and building native C/C++ dependencies from source"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["build-dependencies", "native", "vendor", "cmake", "ffi"]
categories = ["development-tools::build-utils"]
repository = "https://github.com/calebbuffa/woodshed"

[features]
default = ["manifest", "download", "tar-gz"]

# Read project declarations and immutable locks.
manifest = ["dep:toml", "dep:serde", "dep:cargo-platform"]
# Fetch archives over HTTPS.
download = ["dep:ureq"]
# Archive formats. Enable only the ones your dependencies actually ship.
tar-gz = ["dep:tar", "dep:flate2"]
tar-bz2 = ["dep:tar", "dep:bzip2"]
tar-xz = ["dep:tar", "dep:liblzma"]
zip = ["dep:zip"]
# Drive CMake, with the MSVC runtime tied to the Rust target's CRT.
cmake = ["process"]
# Declarative CMake source builds and the one-line Cargo build bridge.
build = ["package-providers"]
# Run child processes so Ctrl+C tears down the whole build tree.
process = ["dep:ctrlc", "dep:libc"]
# Discover an already-installed native library.
vcpkg = ["dep:vcpkg", "package-providers"]
# Install explicit Conan 2 graphs. The caller supplies the Conan executable.
conan = ["package-providers"]
# Shared native-package installation and generated CMake target discovery.
package-providers = ["manifest", "cmake", "dep:serde_json", "dep:tempfile", "dep:shlex"]
pkg-config = ["dep:pkg-config"]
# Resolve and transactionally update dependency declarations and locks.
pin = ["manifest", "download", "dep:toml_edit", "dep:tempfile", "dep:regex", "dep:serde_json"]
# Fetch immutable Git source snapshots and inspect upstream dependency metadata.
git = ["dep:tempfile", "tar-gz"]
# The `woodshed` command-line tool (`cargo install woodshed --features cli`).
cli = ["pin", "git", "bundle", "build", "dep:clap"]
# Assemble a Cargo application with declared native runtime resources.
bundle = ["dep:serde_json", "dep:cargo-config2", "dep:tempfile"]

[[bin]]
name = "woodshed"
path = "src/bin/woodshed.rs"
required-features = ["cli"]

[dependencies]
# Always present: the cache is this crate's reason to exist, and it cannot
# operate safely without checksums or interprocess locks.
sha2 = "0.10"
cargo-platform = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
cargo-config2 = { version = "0.1", optional = true }
tempfile = { version = "3", optional = true }
regex = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
fs4 = "0.13"
shlex = { version = "1.3", optional = true }

serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.9", optional = true }
toml_edit = { version = "0.23", optional = true }
ureq = { version = "3.0", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
bzip2 = { version = "0.6", optional = true }
liblzma = { version = "0.4", optional = true }
zip = { version = "7.2", optional = true, default-features = false, features = [
    "deflate",
] }
ctrlc = { version = "3.4", optional = true }
vcpkg = { version = "0.2", optional = true }
pkg-config = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
junction = "1.2"

[package.metadata.docs.rs]
all-features = true
