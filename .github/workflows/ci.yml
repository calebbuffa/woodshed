name: Native package contracts

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    native:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            CMAKE_GENERATOR: Ninja
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Check native build prerequisites
              run: |
                  cmake --version
                  ninja --version
                  git --version
            - name: Exercise source, graph, linkage and publication contracts
              run: cargo test --features cli,build,vcpkg,conan,git --all-targets -- --test-threads=1
