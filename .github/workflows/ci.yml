name: Native package contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Check native build prerequisites
        run: |
          cmake --version
          ninja --version
          git --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --features cli,build,vcpkg,conan,git --all-targets -- -D warnings
      - name: Exercise source, graph, linkage and publication contracts
        run: cargo test --locked --features cli,build,vcpkg,conan,git --all-targets -- --test-threads=1
      - run: cargo test --locked --features cli,build,vcpkg,conan,git --doc
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --features cli,build,vcpkg,conan,git
